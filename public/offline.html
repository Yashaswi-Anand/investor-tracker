<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Investor</title>
    <!--
      Deliberately self-contained: no stylesheet, no script, no /_next asset.
      This page is served when the network is unreachable, so anything it had
      to fetch would fail with it. It is also the reason it is safe to cache —
      unlike the real pages, nothing here can go stale against a new build.
    -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f2e8;
        --surface: #fffdf7;
        --border: #e3d8c4;
        --text: #14100c;
        --muted: #7b6b55;
        --brand: #8f4429;
        --on-brand: #fdf8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #14100c;
          --surface: #1e1811;
          --border: #372d22;
          --text: #f7f2e8;
          --muted: #a3937c;
          --brand: #d98a52;
          --on-brand: #14100c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 16px;
        border-radius: 13px;
        background: var(--brand);
        display: grid;
        place-items: center;
        color: var(--on-brand);
        font-weight: 800;
        font-size: 1.25rem;
      }
      h1 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; font-size: 0.9rem; color: var(--muted); }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 11px 22px;
        border: none;
        border-radius: 999px;
        background: var(--brand);
        color: var(--on-brand);
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">₹</div>
      <h1>You're offline</h1>
      <!-- No stale figures on purpose: a GMP from hours ago shown as current
           is worse than no figure at all. -->
      <p>
        Investor needs a connection to show live GMP and subscription figures.
        Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
