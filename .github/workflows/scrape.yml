# ===========================================================================
# Scraper cron — runs scraper/run_once.py on GitHub's servers, so IPO data
# stays fresh without your PC being on. See the schedule note below for what
# the interval actually works out to in practice.
#
# Setup (one time):
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL          = https://YOUR-PROJECT-REF.supabase.co
#     SUPABASE_SERVICE_KEY  = eyJ... (service_role key)
#
# Test it: Actions tab -> "scrape" -> "Run workflow" button.
#
# NOTE: scheduled workflows only run on the DEFAULT branch, and GitHub may
# delay cron by a few minutes under load — that is normal.
#
# If NSE ever blocks GitHub's datacenter IPs (runs start failing with
# 403/empty), see DEPLOYMENT.md -> "Agar GitHub Actions se NSE block ho".
# ===========================================================================

name: scrape

on:
  schedule:
    # Every two hours at minute 37 — 12 runs a day at most.
    #
    # "At most" is the honest word, and the gap between what is asked for and
    # what arrives is the whole story of this file. Measured here, in order:
    #
    #   */15  -> median gap 34 min over 166 runs (26 Aug 2026)
    #   0 * * -> 11:43, 12:04, 13:58, 14:55, 16:24, 19:11, 23:16, then 4h45m
    #   37 *  -> gaps of 158, 174, 179, 285, 360 and 384 minutes (30-31 Aug)
    #
    # GitHub runs scheduled workflows on a best-effort basis and silently
    # drops firings under load. Asking for the hour produced about five runs
    # a day, so this now asks for twelve rather than twenty-four. That is a
    # deliberate experiment, not a fix: fewer requests may or may not be
    # delivered more reliably, and it could equally end up as three a day.
    # Whatever happens, the numbers above are how to tell.
    #
    # Minute 37, not 0, and that is the reason for the odd number: the top of
    # the hour is the most contended slot on GitHub's shared scheduler —
    # everybody writes "0 * * * *" — and it is the first thing dropped.
    #
    # If the site ever needs a dependable interval, this has to move off
    # Actions. A cron job on the Hostinger box calling the workflow_dispatch
    # API would actually honour it, costs nothing (cron is included in the
    # Business plan, Actions is free on a public repo), and needs only a
    # fine-grained token with Actions: read and write.
    - cron: "37 */2 * * *"
  workflow_dispatch: {}        # manual run button, for testing

concurrency:
  group: scrape
  cancel-in-progress: false    # never kill a run that is mid-write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # GMP: investorgain (JSON API) is primary; ipowatch/ipocentral
          # fill any IPO it doesn't cover. See scraper/config.py.
          GMP_SOURCE: investorgain
          GMP_FALLBACKS: ipowatch,ipocentral
          # Timetable dates + registrar. Only fetched for IPOs that are still
          # missing them, so this adds no requests in steady state.
          TIMETABLE_SOURCE: investorgain
          TIMETABLE_MAX_FETCHES_PER_RUN: "6"
        run: python run_once.py
